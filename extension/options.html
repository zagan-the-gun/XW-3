<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>出品くん Filler 設定</title>
  <style>
    body { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #1f2328; line-height: 1.7; }
    h1 { font-size: 18px; }
    input { width: 100%; padding: 8px 10px; border: 1px solid #d0d7de; border-radius: 8px; font-size: 14px; }
    button { padding: 8px 16px; border-radius: 8px; border: 1px solid #1f6feb; background: #1f6feb; color: #fff; cursor: pointer; margin-right: 8px; }
    button.sub { background: #f6f8fa; color: #1f2328; border-color: #d0d7de; }
    .row { margin: 16px 0; }
    #status { font-size: 13px; margin-top: 12px; min-height: 1.5em; }
    .ok { color: #067647; } .ng { color: #b42318; }
    p.hint { font-size: 12px; color: #6b7280; }
  </style>
</head>
<body>
  <h1>出品くん Filler 設定</h1>
  <div class="row">
    <label for="base">XW-3 出品くんのURL</label>
    <input id="base" type="url" placeholder="http://192.168.1.10:8720">
    <p class="hint">Dockerを動かしているマシンのアドレス。保存時にこのURLへのアクセス許可を求めます。</p>
  </div>
  <button id="save">保存して許可</button>
  <button id="test" class="sub">接続テスト</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
