<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>mock: メルカリ風出品フォーム(ページ遷移型)</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 20px auto; padding: 0 16px; }
    .field { margin: 12px 0; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
    .lbl { font-weight: 600; margin-bottom: 4px; }
    input, textarea, select { padding: 6px; font-size: 14px; }
    input[type=text], input[type=number], textarea { width: 100%; }
    textarea { height: 80px; }
    .row { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .row .val { color: #06c; }
    #dropzone { border: 2px dashed #aaa; padding: 16px; text-align: center; color: #666; }
    #previews img { width: 50px; height: 50px; object-fit: cover; margin: 3px; }
    ul.opts { list-style: none; padding: 0; }
    ul.opts li { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
    ul.opts li:hover { background: #eef; }
    #report { position: fixed; left: 8px; bottom: 8px; width: 390px; max-height: 92vh; overflow: auto;
      background: #111; color: #eee; font: 12px/1.5 monospace; padding: 10px; border-radius: 8px; }
    #report .ok { color: #6f6; } #report .ng { color: #f77; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="report">起動中…</div>

  <script>
    // 実際のメルカリはカテゴリー/商品の状態/配送の方法が専用ページ(SPAのクライアント遷移)。
    // pushState + 描画切り替えで同じ構造を再現する。
    const FORM_PATH = location.pathname;
    const state = { category: '', condition: '', shipping: '', picked: [] };

    const CATS = {
      'ハンドメイド・手芸': {
        'アクセサリー・ジュエリー': ['ピアス', 'ネックレス'],
        '雑貨・ステーショナリー': ['ブックカバー', 'ポーチ'],
      },
      'アウトドア・釣り・旅行用品': { 'フィッシング': ['釣り仕掛け・仕掛け用品', 'ルアー用品'] },
      'レディース': { 'アクセサリー': ['ピアス'] },
    };
    // 実サイト同様、前方一致する似た名前が多数並ぶ(「DAIWA」を正確に選べる必要がある)
    const BRANDS = [
      ['M&M DYE WORKS', 'エムアンドエムダイワークス'],
      ['DAIWA Industry', 'ダイワインダストリ'],
      ['DAIWA CYCLE', 'ダイワサイクル'],
      ['DAIWA', 'ダイワ'],
      ['DAIWA PIER39', 'ダイワピア39'],
      ['Daiwa Technical', 'ダイワテクニカル'],
      ['大和玩具', 'ダイワガング／ダイワトーイ'],
      ['大和書房', 'ダイワショボウ'],
    ];
    const CONDITIONS = ['新品、未使用', '未使用に近い', '目立った傷や汚れなし', 'やや傷や汚れあり', '傷や汚れあり', '全体的に状態が悪い'];
    // 実サイトは3つのメルカリ便 + 「その他」配下に多数(ゆうメール/レターパック等)
    const SHIPPINGS = [
      'らくらくメルカリ便', 'ゆうゆうメルカリ便', '梱包・発送たのメル便',
      'ゆうメール', 'レターパック', '郵便(定形、定形外、書留など)', 'クロネコヤマト',
      'ゆうパック', 'クリックポスト', 'ゆうパケット', '未定',
    ];

    function go(path) { history.pushState({}, '', path); render(); }

    function formHtml() {
      return `
        <h1>商品の出品</h1>
        <div class="field">
          <div class="lbl">出品する写真</div>
          <input type="file" id="photo-input" accept="image/*" multiple style="display:none">
          <div id="dropzone">クリックまたはドロップ</div>
          <div id="previews"></div>
        </div>
        <div class="field">
          <label class="lbl" for="t">商品名</label>
          <input type="text" id="t" maxlength="40">
        </div>
        <div class="field">
          <div class="lbl">商品の説明</div>
          <div><textarea maxlength="1000"></textarea></div>
        </div>
        <!-- 実サイトはリンクが直接テキストを持つ(アイコンはSVG)。この構造で探索できる必要がある -->
        <div class="field">
          <div class="lbl">カテゴリー</div>
          <a href="/sell/categories" class="cat-link" data-go="/sell/categories"><svg width="12" height="12"></svg>${state.category || 'カテゴリーを選択する'}</a>
        </div>
        <!-- 子spanでラップされた構造 -->
        <!-- ブランド: 行のテキストが「選択してください」で他項目と紛れる。ラベルから辿れる必要がある -->
        <div class="field">
          <div class="lbl">ブランド <span style="font-size:11px;background:#eee;padding:1px 6px">任意</span></div>
          <a href="/sell/brands" data-go="/sell/brands"><span class="icon">＋</span>${state.brand || '選択してください'}</a>
        </div>
        <div class="field">
          <div class="lbl">商品の状態</div>
          <a href="/sell/conditions" data-go="/sell/conditions"><span class="icon">＋</span><span>${state.condition || '商品の状態を選択する'}</span></a>
        </div>
        <div class="field">
          <div class="lbl">配送料の負担</div>
          <select id="payer">
            <option value="">選択してください</option>
            <option>送料込み(出品者負担)</option>
            <option>着払い(購入者負担)</option>
          </select>
        </div>
        <!-- 実サイト同様、配送料の負担を選ぶまで配送の方法の行は出さない -->
        <div class="field">
          <div class="lbl">配送の方法</div>
          ${document.getElementById('payer')?.value || state.payer
            ? `<div class="row" data-go="/sell/shipping_methods">
                 <span>${state.shipping || '配送の方法を選択する'}</span><span class="val">›</span>
               </div>`
            : '<span style="color:#888">配送料の負担を選択してください</span>'}
        </div>
        <div class="field">
          <div class="lbl">発送元の地域</div>
          <select id="from">
            <option value="">選択してください</option>
            <option>北海道</option><option>東京都</option><option>大阪府</option>
          </select>
        </div>
        <div class="field">
          <div class="lbl">発送までの日数</div>
          <select id="days">
            <option value="">選択してください</option>
            <option>1~2日で発送</option><option>2~3日で発送</option><option>4~7日で発送</option>
          </select>
        </div>
        <div class="field">
          <label class="lbl">販売価格 <input type="number" id="price"></label>
        </div>`;
    }

    function listHtml(title, items) {
      return `<h1>${title}</h1><ul class="opts">${items.map((i) => `<li>${i}</li>`).join('')}</ul>`;
    }

    function render() {
      const view = document.getElementById('view');
      const p = location.pathname;
      if (p.startsWith('/sell/categories')) {
        let items;
        if (state.picked.length === 0) items = Object.keys(CATS);
        else if (state.picked.length === 1) items = Object.keys(CATS[state.picked[0]] || {});
        else items = (CATS[state.picked[0]] || {})[state.picked[1]] || [];
        view.innerHTML = listHtml('カテゴリー', items);
        view.querySelectorAll('li').forEach((li) => {
          li.addEventListener('click', () => {
            state.picked.push(li.textContent);
            if (state.picked.length === 3) {
              state.category = state.picked.join(' > ');
              history.back();   // 実サイト同様、最後まで選ぶとフォームへ戻る
            } else {
              render();
            }
          });
        });
        return;
      }
      if (p.startsWith('/sell/brands')) {
        // 検索欄に入力すると候補が絞られる。似た名前が多く並ぶのが要点
        view.innerHTML = `<h1>ブランド</h1>
          <input type="text" id="bq" placeholder="ブランド名を入力" style="width:100%;padding:10px;font-size:16px">
          <div id="blist"></div>`;
        const renderList = () => {
          const q = document.getElementById('bq').value.trim().toLowerCase();
          const hits = q
            ? BRANDS.filter((b) => (b[0] + b[1]).toLowerCase().includes(q))
            : [];
          document.getElementById('blist').innerHTML = hits
            .map((b) => `<div class="brand-row" style="padding:12px;border-bottom:1px solid #eee;cursor:pointer">
                 <div>${b[0]}</div><div style="font-size:12px;color:#666">${b[1]}</div></div>`)
            .join('');
          document.querySelectorAll('.brand-row').forEach((row, i) => {
            row.addEventListener('click', () => {
              state.brand = hits[i][0];
              history.back();
            });
          });
        };
        // 実サイト同様、入力に対して非同期で絞り込む
        document.getElementById('bq').addEventListener('input', () => setTimeout(renderList, 250));
        return;
      }
      if (p.startsWith('/sell/conditions')) {
        // 選ぶと即フォームへ戻るタイプ
        view.innerHTML = listHtml('商品の状態', CONDITIONS);
        view.querySelectorAll('li').forEach((li) => {
          li.addEventListener('click', () => {
            state.condition = li.textContent;
            history.back();
          });
        });
        return;
      }
      if (p.startsWith('/sell/shipping_methods')) {
        // 実サイト同様、選んだあと「更新する」で確定してから戻るタイプ
        let tmp = state.shipping;
        view.innerHTML = `<h1>配送の方法</h1>
          <div>${SHIPPINGS.map((s, i) => `
            <label style="display:block;padding:10px;border-bottom:1px solid #eee">
              <input type="radio" name="ship" value="${s}"> ${s}
            </label>`).join('')}</div>
          <button id="commit" style="margin-top:16px;padding:10px 24px">更新する</button>`;
        view.querySelectorAll('input[name=ship]').forEach((r) => {
          r.addEventListener('change', () => { tmp = r.value; });
        });
        document.getElementById('commit').addEventListener('click', () => {
          state.shipping = tmp;
          history.back();
        });
        return;
      }
      // 出品フォーム
      view.innerHTML = formHtml();
      view.querySelectorAll('[data-go]').forEach((row) => {
        row.addEventListener('click', (e) => {
          e.preventDefault(); // <a>のデフォルト遷移は抑止(SPAのクライアント遷移を模す)
          if (row.dataset.go === '/sell/categories') state.picked = [];
          go(row.dataset.go);
        });
      });
      // 配送料の負担を選んだら配送の方法の行を出す(依存関係の再現)
      const payerSel = document.getElementById('payer');
      if (payerSel) {
        payerSel.value = state.payer || '';
        payerSel.addEventListener('change', () => { state.payer = payerSel.value; render(); });
      }
      const fi = document.getElementById('photo-input');
      const add = (files) => {
        for (const f of files) {
          const img = document.createElement('img');
          img.src = URL.createObjectURL(f);
          document.getElementById('previews').appendChild(img);
        }
      };
      fi.addEventListener('change', (e) => add(e.target.files));
      const dz = document.getElementById('dropzone');
      dz.addEventListener('click', () => fi.click());
      dz.addEventListener('dragover', (e) => e.preventDefault());
      dz.addEventListener('drop', (e) => { e.preventDefault(); add(e.dataTransfer.files); });
    }

    window.addEventListener('popstate', render);
    render();
  </script>

  <script src="../lib/fill.js"></script>
  <script src="../sites/mercari.js"></script>
  <script src="harness.js"></script>
  <script>
    XW3TEST.run('mercari', {
      title: 'ハンドメイド 花モチーフ ピアス ブルー',
      description: 'ハンドメイドのピアスです。\n\n#ハンドメイド #ピアス',
      price: 1200,
      tags: [],
      brand: 'DAIWA',
      category: 'ハンドメイド・手芸 > アクセサリー・ジュエリー > ピアス',
      condition: '新品、未使用',
      shipping: 'ゆうゆうメルカリ便',
      shippingPayer: '送料込み(出品者負担)',
      shipDays: '1~2日で発送',
      shipFrom: '東京都',
    }, {
      expect: {
        'タイトル': 'ハンドメイド 花モチーフ ピアス ブルー',
        '価格': '1200',
        '商品の状態': '新品、未使用',
        '配送の方法(1/2) ゆうゆうメルカリ便': 'ゆうゆうメルカリ便',
        '送料の負担': '送料込み(出品者負担)',
        '発送元の地域': '東京都',
        '発送までの日数': '1~2日で発送',
      },
      // レポート自身の文字列に一致しないよう、確認は必ずフォーム内の要素に限定する
      checkDom: () => {
        const row = (p) => document.querySelector(`[data-go="${p}"]`)?.textContent || '';
        return {
          'フォームに戻っている': !/\/sell\//.test(location.pathname) && !!document.getElementById('t'),
          '説明文が入った': document.querySelector('textarea').value.includes('ハンドメイドのピアス'),
          'カテゴリ3階層が確定した': row('/sell/categories').includes('ハンドメイド・手芸 > アクセサリー・ジュエリー > ピアス'),
          '商品の状態が確定した': row('/sell/conditions').includes('新品、未使用'),
          '配送の方法が「更新する」で確定した': row('/sell/shipping_methods').includes('ゆうゆうメルカリ便'),
          '配送料の負担が先に選ばれた': document.getElementById('payer')?.value === '送料込み(出品者負担)',
          // 「DAIWA Industry」等ではなく「DAIWA」が正確に選ばれること
          'ブランドが正確に選ばれた': row('/sell/brands').includes('DAIWA')
            && !row('/sell/brands').includes('Industry')
            && !row('/sell/brands').includes('CYCLE'),
          '写真3枚がプレビューされた': document.querySelectorAll('#previews img').length === 3,
        };
      },
    });
  </script>
</body>
</html>
